name: Signed macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag or new release tag
        required: true
        type: string
      notarize:
        description: Submit the signed ZIP and DMG to Apple notarization
        required: true
        default: true
        type: boolean

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package-and-release:
    name: Sign, notarize and publish macOS package
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPMENT_TEAM: 7QSPARVZYS
      CODE_SIGN_IDENTITY: Developer ID Application
      CURRENT_PACKAGE_OUTPUT: .build/Packages
      SIGNING_KEYCHAIN_PATH: ${{ runner.temp }}/gitcurrent-signing.keychain-db
      SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      NOTARIZE_REQUESTED: ${{ github.event_name == 'push' && 'true' || inputs.notarize }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Swift 6.2 capable Xcode
        run: |
          selected="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$selected" ]]; then
            echo "A Swift 6.2 / Xcode 26 installation is required." >&2
            exit 1
          fi
          sudo xcode-select -s "$selected"
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Cache verified upstream archives
        uses: actions/cache@v4
        with:
          path: .build/GitBundle/downloads
          key: git-bundle-2.55.0-lfs-3.7.1-${{ runner.arch }}

      - name: Build and verify bundled Git toolchain
        run: Scripts/build-git-bundle.sh

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$SIGNING_KEYCHAIN_PASSWORD" ]]; then
            echo "Missing certificate secrets. Provide the P12 bundle, its password, and a temporary keychain password." >&2
            exit 2
          fi
          certificate_path="$RUNNER_TEMP/gitcurrent-developer-id.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN_PATH"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security import "$certificate_path" \
            -k "$SIGNING_KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$SIGNING_KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$SIGNING_KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN_PATH"

      - name: Configure App Store Connect key for notarization
        if: env.NOTARIZE_REQUESTED == 'true'
        env:
          API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [[ -z "$API_KEY_P8_BASE64" || -z "$API_KEY_ID" || -z "$API_ISSUER_ID" ]]; then
            echo "Missing App Store Connect API key secrets for notarization." >&2
            exit 2
          fi
          api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          xcrun notarytool store-credentials current-ci-notary \
            --key "$api_key_path" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID"

      - name: Create signed package
        run: |
          if [[ "$NOTARIZE_REQUESTED" == "true" ]]; then
            NOTARYTOOL_PROFILE=current-ci-notary Scripts/package-macos.sh --notarize
          else
            Scripts/package-macos.sh --no-notarize
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitCurrent-${{ env.RELEASE_TAG }}-macOS-arm64
          path: |
            .build/Packages/*.zip
            .build/Packages/*.dmg
            .build/Packages/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=""
          case "$RELEASE_TAG" in
            *-*) release_flags="--prerelease" ;;
          esac
          gh release create "$RELEASE_TAG" \
            .build/Packages/*.zip \
            .build/Packages/*.dmg \
            .build/Packages/*.sha256 \
            --title "$RELEASE_TAG" \
            --generate-notes \
            $release_flags

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -f "$SIGNING_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
