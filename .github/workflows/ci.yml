name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-deployment-build:
    name: macOS 14 deployment target
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Swift 6.2 capable Xcode
        run: |
          selected="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$selected" ]]; then
            echo "A Swift 6.2 / Xcode 26 installation is required." >&2
            exit 1
          fi
          sudo xcode-select -s "$selected"
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Test core packages
        run: swift test

      - name: Build Current for arm64 with macOS 14 deployment target
        run: |
          xcodebuild build \
            -project Current.xcodeproj \
            -scheme Current \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
