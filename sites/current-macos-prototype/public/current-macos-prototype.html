&lt;script&gt;
(() =&gt; {

  const state = {

  const icon = (name) =&gt; `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;

  const commitRows = () =&gt; {

  };

  const workspace = (selected, center, inspectorKind = 'commit') =&gt; `

  const renderDiff = () =&gt; `

          &lt;div class=&quot;code-line del&quot;&gt;&lt;span class=&quot;ln&quot;&gt;119&lt;/span&gt;&lt;span class=&quot;ln&quot;&gt;&lt;/span&gt;&lt;span&gt;- let rows = commits.map(makeRow)&lt;/span&gt;&lt;/div&gt;

    if (action === 'fetch' || action === 'pull' || action === 'push') { state.operationRunning = true; render('operations'); }
    if (action === 'commit') { status.textContent = '提交完成 · 9f3a2d1'; render('graph'); }
  });

  root.addEventListener('change', (event) =&gt; {
    if (event.target === sceneSelect) render(sceneSelect.value);
    if (event.target.dataset.action === 'update') { state.autoUpdate = event.target.checked; render('settings'); }
    if (event.target.dataset.action === 'bundled') { state.bundledGit = true; render('settings'); }
    if (event.target.dataset.action === 'custom') { state.bundledGit = false; render('settings'); }
  });

  let initialScene = null;
  try {
    const locationSearch = window.parent === window ? window.location.search : window.parent.location.search;
    initialScene = new URLSearchParams(locationSearch).get('scene');
  } catch (_) {
    initialScene = null;
  }
  render(renderers[initialScene] ? initialScene : 'graph');
})();

  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const openTooltip = (trigger) =&gt; {

      getContent(trigger).length === 0 ||

    }

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;

    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true

        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });

    }

      const rawHref = data.href;

        href = url.href;

        return;

      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
